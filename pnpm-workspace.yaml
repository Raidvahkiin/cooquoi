# legacy/ (old NestJS backend) is kept for reference only: not installed, built or linted.
packages:
  - contracts
  - ts/apps/*
  - ts/libs/**/*

# One version per shared dependency, used by every project through `catalog:`.
catalog:
  "@hey-api/openapi-ts": ^0.99.0
  "@typespec/compiler": ^1.18.0
  "@typespec/http": ^1.18.0
  "@typespec/openapi": ^1.18.0
  "@typespec/openapi3": ^1.18.0
  iron-session: ^8.0.4
  msw: ^3.0.0
  next-intl: ^4.15.3
  next: 16.4.6
  openid-client: ^6.9.1
  react: ^19.3.1
  react-dom: ^19.3.1
  server-only: ^0.0.1
  zod: ^4.6.7

allowBuilds:
  "@biomejs/biome": true
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  nx: true

overrides:
  typescript: npm:@typescript/typescript6@^6.0.2

minimumReleaseAgeExclude:
  - oauth4webapi@3.8.9
  - openid-client@6.9.1

name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  actions: read
  contents: read
  packages: write

env:
  # Disable Nx sync generators check to prevent interactive prompts in CI
  NX_SYNC_GENERATORS_CHECK: false
  REGISTRY: ghcr.io

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v6

      # Node version comes from .node-version (same as local and Docker)
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec nx run-many -t lint --parallel=3

      - name: Typecheck
        run: pnpm exec nx run-many -t typecheck --parallel=3

      - name: Test
        run: pnpm exec nx run-many -t test --parallel=3

  # ADR 0009 §6: the API's real OpenAPI document must match the TypeSpec contract.
  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # SDK version comes from global.json (same as local)
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Writes dotnet/generated/openapi.json (build-time OpenAPI generation)
      - name: Build .NET
        run: dotnet build dotnet/Cooquoi.slnx -v q -nologo -clp:ErrorsOnly

      - name: Generate contract and client
        run: pnpm exec nx run @cooquoi/api-client:generate

      - name: Generated files are committed and fresh
        run: git diff --exit-code contracts/generated dotnet/generated ts/libs/api-client/src/generated

      # Same oasdiff as `@cooquoi/contracts:drift` (v0.2.1 runs tufin/oasdiff:v1.39.0); keep both in step.
      - name: oasdiff (contract vs ASP.NET)
        uses: oasdiff/oasdiff-action/diff@v0.2.1
        with:
          base: contracts/generated/openapi.yaml
          revision: dotnet/generated/openapi.json
          format: json
          exclude-elements: description,examples,summary,tags,title
          output-to-file: oasdiff.json

      - name: Drift gate
        run: node contracts/scripts/drift-gate.mjs oasdiff.json

  build-and-push-images:
    needs: lint-typecheck-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: cooquoi-webapp
            context: .
            dockerfile: ts/apps/cooquoi-webapp/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Required checks (branch protection, set by the repository owner): `ts` and `dotnet`.
# `dotnet` always reports a result: on pull requests its steps are skipped when no C#-relevant file changed.
name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  actions: read # nrwl/nx-set-shas reads workflow runs for the last green SHA

env:
  # Disable Nx sync generators check to prevent interactive prompts in CI
  NX_SYNC_GENERATORS_CHECK: false
  REGISTRY: ghcr.io

jobs:
  # TypeScript and TypeSpec through Nx (ADR 0020): lint, typecheck, test, Biome, knip, build, and contract drift
  # (compiled contract against the committed dotnet/generated/openapi.json, no C# build needed).
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v6

      # Node version comes from .node-version (same as local and Docker)
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Webapp component tests run in Vitest browser mode on Playwright's Chromium.
      - name: Install Playwright Chromium
        run: pnpm --filter @cooquoi/webapp exec playwright install --with-deps chromium

      - uses: nrwl/nx-set-shas@v5

      # Tests run in their own step, after the build: the webapp browser tests failed to import
      # their files when they ran next to `next build` (CI runs 45070791238, 45071436050).
      - name: Verify affected projects (pull request)
        if: github.event_name == 'pull_request'
        run: pnpm exec nx affected -t lint typecheck biome-check knip build drift --parallel=3

      - name: Test affected projects (pull request)
        if: github.event_name == 'pull_request'
        run: pnpm exec nx affected -t test --parallel=3

      - name: Verify every project (main and tags)
        if: github.event_name != 'pull_request'
        run: pnpm exec nx run-many -t lint typecheck biome-check knip build drift --parallel=3

      - name: Test every project (main and tags)
        if: github.event_name != 'pull_request'
        run: pnpm exec nx run-many -t test --parallel=3

      # `nx affected` can skip api-client; regenerate unconditionally so a stale client always fails.
      - name: Generate contract and client
        run: pnpm exec nx run @cooquoi/api-client:generate

      - name: Generated client is committed and fresh
        run: |
          git diff --exit-code contracts/generated ts/libs/api-client/src/generated
          test -z "$(git status --porcelain contracts/generated ts/libs/api-client/src/generated)"

      # Reports only: Biome's size rules are errors, so a violation already failed the step above.
      - name: Size report
        if: always()
        run: |
          {
            echo '## Size report'
            echo
            echo '### Webapp files over 150 lines'
            echo '```'
            find ts/apps/cooquoi-webapp/src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 \
              | xargs -0 wc -l | awk '$1 > 150 && $2 != "total"' | sort -rn
            echo '```'
            echo '### Functions over the Biome limits'
            echo '```'
            pnpm exec biome lint --only=complexity/noExcessiveLinesPerFunction --only=complexity/noExcessiveCognitiveComplexity --reporter=summary . 2>&1 | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # C# through the dotnet CLI (ADR 0020): build, committed OpenAPI document is fresh, tests, format.
  dotnet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists the files of a pull request
    steps:
      - uses: actions/checkout@v6

      # Pull requests only run the steps below when a file ErrorCatalogueTests, the API or Aspire depend on changed.
      # Main and tags always run them.
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            dotnet:
              - 'dotnet/**'
              - 'aspire/**'
              - 'contracts/**'
              - 'global.json'
              - 'ts/apps/cooquoi-webapp/messages/**'

      - name: Decide whether to run
        id: gate
        run: echo "run=${{ github.event_name != 'pull_request' || steps.filter.outputs.dotnet == 'true' }}" >> "$GITHUB_OUTPUT"

      # SDK version comes from global.json (same as local)
      - uses: actions/setup-dotnet@v6
        if: steps.gate.outputs.run == 'true'
        with:
          global-json-file: global.json

      # Docker is preinstalled on ubuntu-latest: Testcontainers (Postgres) uses it.

      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: dotnet build dotnet/Cooquoi.slnx -v q -nologo -clp:ErrorsOnly

      # The build writes dotnet/generated/openapi.json; an endpoint change must commit the regenerated file.
      - name: OpenAPI document is committed and fresh
        if: steps.gate.outputs.run == 'true'
        run: |
          git diff --exit-code dotnet/generated
          test -z "$(git status --porcelain dotnet/generated)"

      - name: Test
        if: steps.gate.outputs.run == 'true'
        run: dotnet test --solution dotnet/Cooquoi.slnx -v q --no-progress

      - name: Format check
        if: steps.gate.outputs.run == 'true'
        run: dotnet format dotnet/Cooquoi.slnx --verify-no-changes

  build-and-push-images:
    needs: [ts, dotnet]
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: cooquoi-webapp
            context: .
            dockerfile: ts/apps/cooquoi-webapp/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  actions: read
  contents: read
  packages: write

env:
  # Disable Nx sync generators check to prevent interactive prompts in CI
  NX_SYNC_GENERATORS_CHECK: false
  REGISTRY: ghcr.io

jobs:
  # One pipeline for every toolchain, all through Nx: lint, typecheck, test (TypeScript and .NET, including
  # the architecture, error catalogue and mirrored-test checks), Biome, knip, `dotnet format`.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v6

      # Node version comes from .node-version (same as local and Docker)
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # SDK version comes from global.json (same as local)
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Docker is preinstalled on ubuntu-latest: Testcontainers (Postgres) uses it.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - name: Verify affected projects (pull request)
        if: github.event_name == 'pull_request'
        run: pnpm exec nx affected -t lint typecheck test biome-check knip build format-check --parallel=3

      - name: Verify every project (main and tags)
        if: github.event_name != 'pull_request'
        run: pnpm exec nx run-many -t lint typecheck test biome-check knip build format-check --parallel=3

      # Reports only: Biome's size rules are errors, so a violation already failed the step above.
      - name: Size report
        if: always()
        run: |
          {
            echo '## Size report'
            echo
            echo '### Webapp files over 150 lines'
            echo '```'
            find ts/apps/cooquoi-webapp/src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 \
              | xargs -0 wc -l | awk '$1 > 150 && $2 != "total"' | sort -rn
            echo '```'
            echo '### Functions over the Biome limits'
            echo '```'
            pnpm exec biome lint --only=complexity/noExcessiveLinesPerFunction --only=complexity/noExcessiveCognitiveComplexity --reporter=summary . 2>&1 | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ADR 0009 §6: the API's real OpenAPI document must match the TypeSpec contract.
  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # SDK version comes from global.json (same as local)
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No graph edge from @cooquoi/dotnet on purpose, so drift runs whatever the change.
      # Builds .NET (writes dotnet/generated/openapi.json), compiles the contract, then oasdiff + drift gate.
      - name: Contract drift
        run: pnpm exec nx run @cooquoi/contracts:drift

      - name: Generate contract and client
        run: pnpm exec nx run @cooquoi/api-client:generate

      - name: Generated files are committed and fresh
        run: |
          git status --porcelain contracts/generated dotnet/generated ts/libs/api-client/src/generated
          test -z "$(git status --porcelain contracts/generated dotnet/generated ts/libs/api-client/src/generated)"

  build-and-push-images:
    needs: [verify, contract-drift]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: cooquoi-webapp
            context: .
            dockerfile: ts/apps/cooquoi-webapp/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

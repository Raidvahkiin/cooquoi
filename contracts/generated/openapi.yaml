openapi: 3.1.0
info:
  title: Cooquoi API
  version: 1.0.0
  description: Cooquoi API — source of truth for every client (ADR 0009).
tags:
  - name: Household
  - name: Foodpedia
paths:
  /v1/ingredients:
    get:
      operationId: searchIngredients
      description: |-
        Q1: searches primary names and synonyms in all locales, accent-insensitive, active locale ranked first.
        Names come in the `Accept-Language` locale (English fallback). `q` is at most 100 characters.
        Sort keys: `relevance`, `name`, `code`; default `-relevance,name` with `q`, `name` without.
      parameters:
        - $ref: '#/components/parameters/Foodpedia.IngredientFilter.tags'
        - $ref: '#/components/parameters/Foodpedia.IngredientFilter.status'
        - name: q
          in: query
          required: false
          description: Free-text search.
          schema:
            type: string
          explode: false
        - name: sort
          in: query
          required: false
          description: Sort fields among the ones the resource whitelists; a leading `-` sorts descending, e.g. `-expiresAt`.
          schema:
            type: array
            items:
              type: string
        - name: page
          in: query
          required: false
          description: 1-based page number.
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
          explode: false
        - name: pageSize
          in: query
          required: false
          description: Page size, at most 100 (server-enforced).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - page
                  - pageSize
                  - totalCount
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Foodpedia.IngredientSummary'
                  page:
                    type: integer
                    format: int32
                  pageSize:
                    type: integer
                    format: int32
                  totalCount:
                    type: integer
                    format: int64
                description: One page of a list.
        '400':
          description: '400 — invalid request: field errors, bad sort, missing `Idempotency-Key`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '401':
          description: 401 — missing or invalid access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
      tags:
        - Foodpedia
    post:
      operationId: createIngredient
      description: |-
        C1: creates an ingredient. Requires the curator role.
        Errors: `foodpedia.code-taken`, `foodpedia.name-taken` (409), `foodpedia.unknown-tags` (422).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foodpedia.CreatedIngredient'
        '400':
          description: '400 — invalid request: field errors, bad sort, missing `Idempotency-Key`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '401':
          description: 401 — missing or invalid access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '403':
          description: 403 — the caller may not do this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '409':
          description: '409 — conflicting state: duplicate, lost concurrency race, request still running or already processed.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '422':
          description: 422 — a business rule rejects the request, or the `Idempotency-Key` was reused.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
      tags:
        - Foodpedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Foodpedia.CreateIngredient'
  /v1/ingredients/{ingredientId}:
    get:
      operationId: getIngredient
      description: 'Q2: one ingredient, name and synonyms in the `Accept-Language` locale (English fallback).'
      parameters:
        - name: ingredientId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Id'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            ETag:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foodpedia.IngredientDetail'
        '401':
          description: 401 — missing or invalid access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '404':
          description: 404 — the resource does not exist or is not visible to the caller.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
      tags:
        - Foodpedia
  /v1/ingredients/{ingredientId}:define-conversion:
    post:
      operationId: defineConversion
      description: 'C5: defines or replaces the conversion of one unit. Requires the curator role.'
      parameters:
        - name: ingredientId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
          headers:
            ETag:
              required: true
              schema:
                type: string
        '400':
          description: '400 — invalid request: field errors, bad sort, missing `Idempotency-Key`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '401':
          description: 401 — missing or invalid access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '403':
          description: 403 — the caller may not do this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '404':
          description: 404 — the resource does not exist or is not visible to the caller.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '409':
          description: '409 — conflicting state: duplicate, lost concurrency race, request still running or already processed.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '412':
          description: 412 — `If-Match` does not match the current version.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '422':
          description: 422 — a business rule rejects the request, or the `Idempotency-Key` was reused.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '428':
          description: 428 — `If-Match` is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
      tags:
        - Foodpedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Foodpedia.DefineConversion'
  /v1/ingredients/{ingredientId}:set-expiry-kind:
    post:
      operationId: setExpiryKind
      description: |-
        C11: sets how the expiry date of one ingredient is known. Requires the curator role.
        Errors: `foodpedia.ingredient-retired` (422).
      parameters:
        - name: ingredientId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Id'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
          headers:
            ETag:
              required: true
              schema:
                type: string
        '400':
          description: '400 — invalid request: field errors, bad sort, missing `Idempotency-Key`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '401':
          description: 401 — missing or invalid access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '403':
          description: 403 — the caller may not do this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '404':
          description: 404 — the resource does not exist or is not visible to the caller.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '409':
          description: '409 — conflicting state: duplicate, lost concurrency race, request still running or already processed.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '412':
          description: 412 — `If-Match` does not match the current version.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '422':
          description: 422 — a business rule rejects the request, or the `Idempotency-Key` was reused.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
        '428':
          description: 428 — `If-Match` is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
      tags:
        - Foodpedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Foodpedia.SetExpiryKind'
  /v1/me:
    get:
      operationId: getMe
      description: |-
        Returns the signed-in user's profile and households.
        On first sign-in, creates the profile and a personal household (ADR 0015).
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household.Me'
        '401':
          description: 401 — missing or invalid access token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Common.ProblemDetails'
      tags:
        - Household
security:
  - BearerAuth: []
components:
  parameters:
    Foodpedia.IngredientFilter.status:
      name: status
      in: query
      required: false
      description: Curators only; others always see active ingredients.
      schema:
        $ref: '#/components/schemas/Foodpedia.IngredientStatus'
      explode: false
    Foodpedia.IngredientFilter.tags:
      name: tags
      in: query
      required: false
      description: Tag codes (`<namespace>:<value>`); all must match.
      schema:
        type: array
        items:
          type: string
  schemas:
    Common.BaseUnit:
      type: string
      enum:
        - g
        - ml
        - piece
      description: Units an ingredient may be measured in by default.
    Common.CommonErrorCode:
      type: string
      enum:
        - common.validation
        - common.invalid-sort
        - common.not-found
        - common.unauthorized
        - common.forbidden
        - common.concurrency-conflict
        - common.version-mismatch
        - common.if-match-required
        - common.idempotency-key-required
        - common.idempotency-key-reused
        - common.request-in-progress
        - common.request-already-processed
        - common.unexpected
      description: Stable error codes shared by every context (ADR 0014 §9).
    Common.FieldError:
      type: object
      required:
        - field
        - code
      properties:
        field:
          type: string
          description: JSON path of the field in the request, e.g. `names[1].primary`.
        code:
          $ref: '#/components/schemas/Common.ValidationCode'
          description: Stable code clients translate.
        params:
          type: object
          additionalProperties: {}
          description: 'Values for the translated message, e.g. `{ "max": 100 }`.'
      description: One field error of a validation problem, translatable by code.
    Common.Id:
      type: string
      format: uuid
      description: Opaque identifier (UUID v7 server-side).
    Common.Locale:
      type: string
      enum:
        - en
        - fr
        - vi
      description: Supported UI and content languages (ADR 0012).
    Common.ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine code clients translate (`<context>.<error>`).
        params:
          type: object
          additionalProperties: {}
          description: Values for the translated message.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Common.FieldError'
          description: Field errors, present on validation problems.
        traceId:
          type: string
          description: W3C trace id, to correlate with logs.
      description: RFC 9457 problem details with Cooquoi extensions (ADR 0014 §10).
    Common.Unit:
      type: string
      enum:
        - g
        - kg
        - ml
        - l
        - tsp
        - tbsp
        - cup
        - piece
        - pack
        - can
        - bottle
        - slice
        - fillet
        - clove
        - bunch
        - pinch
      description: Unit codes of the fixed unit catalogue (Foodpedia domain model); adding one is a contract change.
    Common.ValidationCode:
      type: string
      enum:
        - validation.required
        - validation.max-length
        - validation.min-length
        - validation.min
        - validation.max
        - validation.range
        - validation.pattern
        - validation.invalid
        - validation.one-of
      description: Stable codes of field errors (`errors[].code`), shared by every validator.
    Foodpedia.Conversion:
      type: object
      required:
        - unit
        - unitAmount
        - baseAmount
      properties:
        unit:
          $ref: '#/components/schemas/Common.Unit'
        unitAmount:
          type: number
          format: decimal
        baseAmount:
          type: number
          format: decimal
      description: How many base units one `unit` of this ingredient weighs or holds, e.g. 1 `clove` = 5 `g`.
    Foodpedia.CreateIngredient:
      type: object
      required:
        - code
        - names
        - baseUnit
        - expiryKind
        - tags
      properties:
        code:
          type: string
          description: Kebab-case, unique.
        names:
          type: array
          items:
            $ref: '#/components/schemas/Foodpedia.IngredientName'
          description: One per locale; English required.
        baseUnit:
          $ref: '#/components/schemas/Common.BaseUnit'
        expiryKind:
          $ref: '#/components/schemas/Foodpedia.ExpiryKind'
        tags:
          type: array
          items:
            type: string
          description: At least one `category:` tag.
        conversions:
          type: array
          items:
            $ref: '#/components/schemas/Foodpedia.Conversion'
        shelfLife:
          $ref: '#/components/schemas/Foodpedia.ShelfLife'
      description: Body of the ingredient creation (C1); business rules F1–F9.
    Foodpedia.CreatedIngredient:
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/Common.Id'
      description: Id of the created ingredient.
    Foodpedia.DefineConversion:
      type: object
      required:
        - unit
        - unitAmount
        - baseAmount
      properties:
        unit:
          $ref: '#/components/schemas/Common.Unit'
        unitAmount:
          type: number
          format: decimal
        baseAmount:
          type: number
          format: decimal
      description: Body of a conversion definition (C5); replaces an existing one for the same unit.
    Foodpedia.ExpiryKind:
      type: string
      enum:
        - printed
        - estimated
        - longLife
      description: How the expiry date of an ingredient is known (F12).
    Foodpedia.FoodpediaErrorCode:
      type: string
      enum:
        - foodpedia.code-taken
        - foodpedia.invalid-code
        - foodpedia.invalid-name
        - foodpedia.english-name-required
        - foodpedia.duplicate-locale
        - foodpedia.name-missing
        - foodpedia.name-taken
        - foodpedia.invalid-base-unit
        - foodpedia.invalid-conversion-amount
        - foodpedia.conversion-not-needed
        - foodpedia.invalid-shelf-life
        - foodpedia.category-tag-required
        - foodpedia.ingredient-retired
        - foodpedia.invalid-tag-code
        - foodpedia.invalid-tag-label
        - foodpedia.english-label-required
        - foodpedia.unknown-tags
      description: Stable error codes of the Foodpedia context (`problem.code`), next to `CommonErrorCode`.
    Foodpedia.IngredientDetail:
      type: object
      required:
        - id
        - code
        - locale
        - name
        - synonyms
        - baseUnit
        - expiryKind
        - conversions
        - shelfLife
        - tags
        - status
        - version
      properties:
        id:
          $ref: '#/components/schemas/Common.Id'
        code:
          type: string
        locale:
          $ref: '#/components/schemas/Common.Locale'
        name:
          type: string
        synonyms:
          type: array
          items:
            type: string
        baseUnit:
          $ref: '#/components/schemas/Common.BaseUnit'
        expiryKind:
          $ref: '#/components/schemas/Foodpedia.ExpiryKind'
        conversions:
          type: array
          items:
            $ref: '#/components/schemas/Foodpedia.Conversion'
        shelfLife:
          anyOf:
            - $ref: '#/components/schemas/Foodpedia.ShelfLife'
            - type: 'null'
        tags:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/Foodpedia.IngredientStatus'
        version:
          type: integer
          format: int64
      description: One ingredient in the requested locale; `version` is sent back as `If-Match`.
    Foodpedia.IngredientName:
      type: object
      required:
        - locale
        - primary
      properties:
        locale:
          $ref: '#/components/schemas/Common.Locale'
        primary:
          type: string
        synonyms:
          type: array
          items:
            type: string
      description: A name of the ingredient in one locale.
    Foodpedia.IngredientStatus:
      type: string
      enum:
        - active
        - retired
      description: Lifecycle of an ingredient; retired ones are hidden from non-curators.
    Foodpedia.IngredientSummary:
      type: object
      required:
        - id
        - code
        - name
        - baseUnit
        - categoryTags
      properties:
        id:
          $ref: '#/components/schemas/Common.Id'
        code:
          type: string
        name:
          type: string
        baseUnit:
          $ref: '#/components/schemas/Common.BaseUnit'
        categoryTags:
          type: array
          items:
            type: string
      description: One search result; the name is in the requested locale, English when missing.
    Foodpedia.SetExpiryKind:
      type: object
      required:
        - expiryKind
      properties:
        expiryKind:
          $ref: '#/components/schemas/Foodpedia.ExpiryKind'
      description: Body of an expiry kind change (C11).
    Foodpedia.ShelfLife:
      type: object
      required:
        - days
        - recommendedStorage
      properties:
        days:
          type: integer
          format: int32
        recommendedStorage:
          $ref: '#/components/schemas/Foodpedia.Storage'
      description: How long an ingredient keeps, and where.
    Foodpedia.Storage:
      type: string
      enum:
        - fridge
        - freezer
        - room
      description: Where an ingredient keeps best.
    Household.HouseholdSummary:
      type: object
      required:
        - id
        - name
        - role
      properties:
        id:
          $ref: '#/components/schemas/Common.Id'
        name:
          anyOf:
            - type: string
            - type: 'null'
          description: Null until renamed; clients display a translated default ("My household").
        role:
          $ref: '#/components/schemas/Household.MembershipRole'
      description: A household the user belongs to.
    Household.Me:
      type: object
      required:
        - profile
        - households
      properties:
        profile:
          $ref: '#/components/schemas/Household.UserProfile'
        households:
          type: array
          items:
            $ref: '#/components/schemas/Household.HouseholdSummary'
      description: The signed-in user's profile and households.
    Household.MembershipRole:
      type: string
      enum:
        - owner
        - member
      description: Role of a user in a household.
    Household.UserProfile:
      type: object
      required:
        - userId
        - displayName
        - email
        - locale
        - defaultHouseholdId
      properties:
        userId:
          $ref: '#/components/schemas/Common.Id'
        displayName:
          type: string
        email:
          anyOf:
            - type: string
            - type: 'null'
        locale:
          $ref: '#/components/schemas/Common.Locale'
        defaultHouseholdId:
          $ref: '#/components/schemas/Common.Id'
      description: What Cooquoi stores about the signed-in user (ADR 0015).
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: https://api.cooquoi.com
    description: Production
    variables: {}
